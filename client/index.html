<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>RBS School — Learn • Lead • Succeed</title>
    <meta name="description" content="Shree Rastriya Basic School is a learning community in Ramfok helping young people build knowledge, character, and a useful sense of place." />
    <meta property="og:title" content="Shree Rastriya Basic School" />
    <meta property="og:description" content="A place to practice becoming." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/manus-storage/school-hero_83c42ac7.jpg" />
    <link rel="icon" type="image/png" href="/manus-storage/school-mark_96954ab1.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      const route = sessionStorage.getItem("spa-route");
      if (route) {
        sessionStorage.removeItem("spa-route");
        const repository = window.location.pathname.split("/")[1];
        history.replaceState(null, "", `/${repository}${route}`);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
